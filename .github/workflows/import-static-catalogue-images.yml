              'tejum-2bhk-smart-premium.png': 'https://media.canva.com/v2/document-image/hash:1182546623/height:547/id:DAHQfQPNjLA/type:B/width:365?brand=BAFRoenlaWU&csig=AAAAAAAAAAAAAAAAAAAAAEsTrDuax28doz_voyx67zUEQigAA5f8t_76UVgHjmxY&disableexport=T&exp=1785076966&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FPNjLA%2FDAHQfQPNjLA%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260726%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260726T000538Z%26X-Amz-Expires%3D52628%26X-Amz-Signature%3D187712b2738e4377bbca3d7f8eeeae63a4b58a690d8ad4dec0795f0a1ba79957%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252026%2520Jul%25202026%252014%253A42%253A46%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAACULQounPmA9wTu-oAB25d-SkodiUP9OxshcVLxAs-4q&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1',
              'tejum-3bhk-smart-premium.png': 'https://media.canva.com/v2/document-image/hash:1254831974/height:547/id:DAHQfUA66UQ/type:B/width:365?brand=BAFRoenlaWU&csig=AAAAAAAAAAAAAAAAAAAAAGgyAjGPYA1yQ_G-tagbMAj7CiH5RShRI1K26buC6AXZ&disableexport=T&exp=1785077005&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FA66UQ%2FDAHQfUA66UQ%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260725%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260725T191735Z%26X-Amz-Expires%3D69950%26X-Amz-Signature%3Da477b022b47c16c249e37d80ecb2acf639df584a14ab4688b9e8793dc9e2113c%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252026%2520Jul%25202026%252014%253A43%253A25%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAALv-ijCdN-4xzj_wH9ehX85R1CP6xCiDF12rkhzQCdCJ&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1',
          }

          destination = Path('public/catalogue-images')
          destination.mkdir(parents=True, exist_ok=True)

          for filename, preview_url in images.items():
              query = parse_qs(urlsplit(preview_url).query)
              source_url = query['fallback'][0]
              request = Request(source_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urlopen(request, timeout=90) as response:
                  data = response.read()
              if len(data) < 50000 or not data.startswith(b'\x89PNG'):
                  raise RuntimeError(f'Invalid download for {filename}: {len(data)} bytes')
              (destination / filename).write_bytes(data)
              print(f'{filename}: {len(data)} bytes')
          PY

      - name: Commit static catalogue images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalogue-images
          git diff --cached --quiet && exit 0
          git commit -m 'Add final static catalogue images'
          git push
