name: Import final Tejum catalogue images

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/import-static-catalogue-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download final catalogue artwork
