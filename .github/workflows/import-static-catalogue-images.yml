              'tejum-3bhk-smart-luxury.png': 'https://media.canva.com/v2/document-image/hash:-385082157/height:548/id:DAHQfa2FCog/type:B/width:365?brand=BAFRoenlaWU&csig=AAAAAAAAAAAAAAAAAAAAACQnIoUTbv8Ix3miQQ-gM1yVYpIJWwJIJK2kf0RqTHJG&disableexport=T&exp=1785076894&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F2FCog%2FDAHQfa2FCog%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260726%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260726T041351Z%26X-Amz-Expires%3D37663%26X-Amz-Signature%3D54054b75a9783a0555108f1ed56f16b0a75b287cfdb1d76e7e8af11b1a4104ca%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252026%2520Jul%25202026%252014%253A41%253A34%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJD-3KNQwinGV1SDgD13yd5WNPEbwMBq3KDbhPfIokGj&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1',
